# Internet entry only. No host port maps to this listener; Funnel targets 8082.
# $uri is normalized by nginx before the allowlist is evaluated.
map "$request_method:$uri" $commercial_public_route {
    default 0;
    "~^(GET|HEAD):/(|catalogo/?|catalogo/[0-9]+|asesoria|agenda|servicios|privacidad|faq|checkout/(custom|[0-9]+)|confirmacion|condiciones|conocenos|quienes-somos|simulador/(casa|apartamento))$" 1;
    "~^(GET|HEAD):/(assets|images|banner-assets|catalogo|smart-assets|locales)/.+$" 1;
    "~^(GET|HEAD):/(favicon.ico|index.html|robots.txt)$" 1;
    "~^(GET|HEAD|OPTIONS):/api/(brands|combos(/[0-9]+(/price)?)?|coverage-areas|social-links|banners|products|settings/public|health/(live|ready)|advisory/privacy|simulation/capabilities|agenda/slots|agenda/book/[-a-zA-Z0-9]+|chat/sessions/[-a-zA-Z0-9]+|orders/[-a-zA-Z0-9]+(/pdf)?)$" 1;
    "~^(POST|OPTIONS):/api/(custom-combo/price|orders|payments/wompi/webhook|advisory/(profile|requests)|simulation/interpret|agenda/book|chat/sessions(/[-a-zA-Z0-9]+)?)$" 1;
    "~^(GET|HEAD):/api/uploads/(catalog|banners|marcas|equipo|productos|combos)/.+\.(jpg|jpeg|png|webp|mp4)$" 1;
}

server {
    listen 8082;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    # No ambiguous encodings that another proxy could decode differently.
    if ($request_uri ~* "^[^?]*%(2f|5c|25|00)") { return 400; }
    if ($commercial_public_route = 0) { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://checkout.wompi.co" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- House -->
  <rect x="80" y="200" width="160" height="140" rx="4" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polygon points="60,200 160,130 260,200" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <rect x="120" y="270" width="40" height="70" rx="2" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="175" y="235" width="30" height="30" rx="2" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1"/>

  <!-- Camera 1 - left -->
  <circle cx="75" cy="195" r="10" stroke="#f97316" stroke-width="2" fill="none"/>
  <rect x="70" y="185" width="10" height="6" rx="2" fill="#f97316"/>
  <line x1="75" y1="195" x2="120" y2="235" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Camera 2 - top -->
  <circle cx="160" cy="125" r="10" stroke="#f97316" stroke-width="2" fill="none"/>
  <rect x="155" y="115" width="10" height="6" rx="2" fill="#f97316"/>
  <line x1="160" y1="125" x2="160" y2="170" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Camera 3 - right -->
  <circle cx="245" cy="195" r="10" stroke="#f97316" stroke-width="2" fill="none"/>
  <rect x="240" y="185" width="10" height="6" rx="2" fill="#f97316"/>
  <line x1="245" y1="195" x2="200" y2="235" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- DVR -->
  <rect x="320" y="230" width="100" height="80" rx="4" stroke="#22d3ee" stroke-width="2" fill="none"/>
  <rect x="330" y="240" width="80" height="12" rx="2" fill="#22d3ee" fill-opacity="0.2"/>
  <circle cx="405" cy="295" r="4" fill="#22d3ee"/>
  <text x="370" y="253" text-anchor="middle" fill="#22d3ee" font-size="7" font-family="monospace">DVR</text>
  <text x="345" y="278" fill="#22d3ee" font-size="6" font-family="monospace" opacity="0.6">CH1</text>
  <text x="345" y="288" fill="#22d3ee" font-size="6" font-family="monospace" opacity="0.6">CH2</text>
  <text x="345" y="298" fill="#22d3ee" font-size="6" font-family="monospace" opacity="0.6">CH3</text>

  <!-- Cables from house to DVR -->
  <line x1="240" y1="260" x2="320" y2="260" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="270" x2="320" y2="270" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="280" x2="320" y2="280" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Monitor -->
  <rect x="480" y="210" width="120" height="80" rx="4" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <rect x="485" y="215" width="110" height="65" rx="2" fill="#a78bfa" fill-opacity="0.1"/>
  <rect x="520" y="290" width="40" height="8" rx="2" fill="#a78bfa"/>
  <rect x="525" y="298" width="30" height="20" rx="2" fill="#a78bfa" fill-opacity="0.3"/>
  <text x="540" y="255" text-anchor="middle" fill="#a78bfa" font-size="7" font-family="monospace">LIVE VIEW</text>
  <!-- Monitor screen elements -->
  <rect x="490" y="222" width="32" height="22" rx="1" fill="#a78bfa" fill-opacity="0.15"/>
  <rect x="527" y="222" width="32" height="22" rx="1" fill="#a78bfa" fill-opacity="0.15"/>
  <rect x="490" y="248" width="32" height="22" rx="1" fill="#a78bfa" fill-opacity="0.15"/>
  <rect x="527" y="248" width="32" height="22" rx="1" fill="#a78bfa" fill-opacity="0.15"/>

  <!-- Cable from DVR to monitor -->
  <line x1="420" y1="260" x2="480" y2="250" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Router/Internet -->
  <rect x="480" y="340" width="60" height="30" rx="8" stroke="#34d399" stroke-width="2" fill="none"/>
  <line x1="490" y1="350" x2="530" y2="350" stroke="#34d399" stroke-width="2"/>
  <line x1="490" y1="358" x2="530" y2="358" stroke="#34d399" stroke-width="2"/>
  <text x="510" y="340" text-anchor="middle" fill="#34d399" font-size="7" font-family="monospace">INTERNET</text>

  <!-- Cloud icon -->
  <path d="M470 375 Q470 360 485 360 Q490 345 510 345 Q530 345 535 360 Q550 360 550 375 Z" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- Cable from DVR to router -->
  <line x1="370" y1="310" x2="370" y2="355" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="370" y1="355" x2="480" y2="355" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Phone -->
  <rect x="570" y="360" width="35" height="55" rx="4" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <rect x="575" y="365" width="25" height="40" rx="2" fill="#38bdf8" fill-opacity="0.1"/>
  <circle cx="587" cy="406" r="3" fill="#38bdf8"/>
  <text x="587" y="378" text-anchor="middle" fill="#38bdf8" font-size="6" font-family="monospace">APP</text>

  <!-- Wireless signals -->
  <path d="M555 365 Q570 350 587 365" stroke="#34d399" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M550 370 Q570 342 587 370" stroke="#34d399" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Labels -->
  <text x="160" y="170" text-anchor="middle" fill="#f97316" font-size="10" font-family="monospace" opacity="0.8">CÁMARAS</text>
  <text x="370" y="220" text-anchor="middle" fill="#22d3ee" font-size="10" font-family="monospace" opacity="0.8">GRABACIÓN</text>
  <text x="540" y="200" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="monospace" opacity="0.8">MONITOREO</text>
  <text x="510" y="420" text-anchor="middle" fill="#34d399" font-size="10" font-family="monospace" opacity="0.8">ACCESO REMOTO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Bullet camera (left) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="20" width="35" height="60" rx="4" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="17" cy="50" r="12" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="17" cy="50" r="4" fill="#38bdf8" fill-opacity="0.3"/>
    <rect x="12" y="80" width="10" height="30" rx="2" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="17" y="130" text-anchor="middle" fill="#38bdf8" font-size="9" font-family="sans-serif">Cámara</text>
    <text x="17" y="142" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="sans-serif" opacity="0.7">Bullet 4K</text>
  </g>

  <!-- Dome camera (center-left) -->
  <g transform="translate(230, 80)">
    <circle cx="40" cy="40" r="35" stroke="#22d3ee" stroke-width="2" fill="none"/>
    <circle cx="40" cy="40" r="20" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="40" r="8" fill="#22d3ee" fill-opacity="0.2"/>
    <rect x="30" y="75" width="20" height="5" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
    <text x="40" y="100" text-anchor="middle" fill="#22d3ee" font-size="9" font-family="sans-serif">Cámara</text>
    <text x="40" y="112" text-anchor="middle" fill="#22d3ee" font-size="8" font-family="sans-serif" opacity="0.7">Domo 5MP</text>
  </g>

  <!-- PTZ camera (center-right) -->
  <g transform="translate(430, 60)">
    <rect x="15" y="0" width="50" height="15" rx="3" stroke="#f97316" stroke-width="2" fill="none"/>
    <rect x="22" y="15" width="36" height="45" rx="4" stroke="#f97316" stroke-width="2" fill="none"/>
    <circle cx="40" cy="38" r="14" stroke="#f97316" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="38" r="4" fill="#f97316" fill-opacity="0.3"/>
    <text x="40" y="80" text-anchor="middle" fill="#f97316" font-size="9" font-family="sans-serif">Cámara</text>
    <text x="40" y="92" text-anchor="middle" fill="#f97316" font-size="8" font-family="sans-serif" opacity="0.7">PTZ 2MP</text>
  </g>

  <!-- DVR (right) -->
  <g transform="translate(580, 90)">
    <rect x="0" y="10" width="100" height="90" rx="6" stroke="#a78bfa" stroke-width="2" fill="none"/>
    <rect x="8" y="18" width="84" height="15" rx="2" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="50" y="29" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="sans-serif">HiLook DVR</text>
    <rect x="8" y="38" width="20" height="12" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <rect x="32" y="38" width="20" height="12" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <rect x="56" y="38" width="20" height="12" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <rect x="80" y="38" width="12" height="12" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <text x="8" y="63" fill="#a78bfa" font-size="6" font-family="sans-serif">CH1</text>
    <text x="32" y="63" fill="#a78bfa" font-size="6" font-family="sans-serif">CH2</text>
    <text x="56" y="63" fill="#a78bfa" font-size="6" font-family="sans-serif">CH3</text>
    <text x="18" y="75" text-anchor="middle" fill="#a78bfa" font-size="5" font-family="sans-serif">HDMI</text>
    <rect x="8" y="78" width="10" height="6" rx="1" fill="#a78bfa" fill-opacity="0.3"/>
    <rect x="22" y="78" width="10" height="6" rx="1" fill="#a78bfa" fill-opacity="0.3"/>
    <text x="50" y="92" text-anchor="middle" fill="#a78bfa" font-size="6" font-family="sans-serif">8 Canales 1080p</text>
  </g>

  <!-- Small cameras at bottom -->
  <!-- WiFi camera -->
  <g transform="translate(80, 300)">
    <rect x="5" y="10" width="30" height="50" rx="5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="20" cy="35" r="8" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="20" cy="35" r="3" fill="#38bdf8" fill-opacity="0.3"/>
    <text x="20" y="72" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="sans-serif" opacity="0.8">WiFi</text>
  </g>

  <!-- IP camera -->
  <g transform="translate(200, 310)">
    <rect x="0" y="0" width="30" height="40" rx="4" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
    <circle cx="15" cy="20" r="6" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
    <line x1="15" y1="40" x2="15" y2="55" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="15" y="65" text-anchor="middle" fill="#22d3ee" font-size="8" font-family="sans-serif" opacity="0.8">IP PoE</text>
  </g>

  <!-- Solar camera -->
  <g transform="translate(340, 290)">
    <rect x="5" y="15" width="30" height="45" rx="4" stroke="#f97316" stroke-width="1.5" fill="none"/>
    <rect x="0" y="0" width="40" height="15" rx="3" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/>
    <line x1="10" y1="5" x2="10" y2="12" stroke="#f97316" stroke-width="1"/>
    <line x1="20" y1="3" x2="20" y2="12" stroke="#f97316" stroke-width="1"/>
    <line x1="30" y1="5" x2="30" y2="12" stroke="#f97316" stroke-width="1"/>
    <circle cx="20" cy="38" r="7" stroke="#f97316" stroke-width="1.5" fill="none"/>
    <text x="20" y="72" text-anchor="middle" fill="#f97316" font-size="8" font-family="sans-serif" opacity="0.8">Solar</text>
  </g>

  <!-- NVR -->
  <g transform="translate(480, 300)">
    <rect x="0" y="0" width="90" height="60" rx="5" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
    <rect x="5" y="6" width="80" height="12" rx="1" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="45" y="15" text-anchor="middle" fill="#a78bfa" font-size="7" font-family="sans-serif">Hikvision NVR</text>
    <rect x="5" y="22" width="25" height="10" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <rect x="33" y="22" width="25" height="10" rx="1" stroke="#a78bfa" stroke-width="1" fill="none"/>
    <circle cx="75" cy="45" r="4" fill="#22c55e" fill-opacity="0.6"/>
    <text x="45" y="52" text-anchor="middle" fill="#a78bfa" font-size="6" font-family="sans-serif">16CH 4K NVR</text>
  </g>

  <!-- Lines connecting cameras to DVR/NVR -->
  <path d="M95 160 L95 200 L320 200 L320 180" stroke="#52525b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M270 160 L270 200 L320 200 L320 180" stroke="#52525b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M480 140 L480 200 L420 200 L420 180" stroke="#52525b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Main title -->
  <text x="400" y="460" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="sans-serif" font-weight="bold" opacity="0.9">
    Hikvision / HiLook — Calidad y confianza
  </text>
  <text x="400" y="480" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif" opacity="0.7">
    Equipos profesionales para tu hogar o negocio
  </text>

  <!-- Decorative dots -->
  <circle cx="700" cy="30" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="720" cy="50" r="1.5" fill="#22d3ee" opacity="0.2"/>
  <circle cx="30" cy="20" r="2" fill="#f97316" opacity="0.3"/>
  <circle cx="50" cy="40" r="1.5" fill="#a78bfa" opacity="0.2"/>
</svg>

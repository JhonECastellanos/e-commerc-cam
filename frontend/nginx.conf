# Some Python runtimes classify WebP uploads as generic binary data. Preserve
# every other upstream type, including JSON error responses and downloads.
map "$uri:$upstream_http_content_type" $catalog_content_type {
    default $upstream_http_content_type;
    "~*^/api/uploads/.+\\.webp:application/octet-stream$" "image/webp";
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /favicon.ico {
        absolute_redirect off;
        return 302 /images/favicon.svg;
    }

    location ^~ /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_hide_header Content-Type;
        add_header Content-Type $catalog_content_type always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # The photograph directory shares the SPA route name. Serve the application
    # for these two URLs; /catalogo/*.webp still uses the static image location.
    location = /catalogo {
        try_files /index.html =404;
    }
    location = /catalogo/ {
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

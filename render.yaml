# Blueprint de despliegue en Render (https://render.com) — plan gratuito.
# Uso: sube el repo a GitHub → Render → New → Blueprint → selecciona el repo.
# Nota plan free: el backend se "duerme" tras 15 min sin tráfico (el primer request
# tarda ~30-60 s) y la base de datos gratuita de Render expira a los 30 días.
# Para algo permanente y gratis usa una base en Neon (https://neon.tech) y pega su
# URL en DATABASE_URL en lugar de fromDatabase.

databases:
  - name: instalacam-db
    plan: free
    databaseName: instalacam
    user: instalacam

services:
  - type: web
    name: instalacam-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: instalacam-db
          property: connectionString
      # Completar al crear el blueprint (Render los pedirá):
      - key: FRONTEND_ORIGINS      # ej. https://instalacam-frontend.onrender.com
        sync: false
      - key: TRUSTED_HOSTS         # ej. instalacam-backend.onrender.com
        sync: false
      - key: WOMPPI_PUBLIC_KEY     # pub_test_... (sandbox) o pub_prod_...
        sync: false
      - key: WOMPPI_PRIVATE_KEY
        sync: false
      - key: WOMPPI_WEBHOOK_SECRET # "Secreto de eventos" del panel Wompi
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_PROVIDER
        value: "off"
      - key: PRIVATE_FILES_DIR
        value: /tmp/private_agreements

  - type: web
    name: instalacam-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Proxy del API hacia el backend (mismo rol que nginx en docker-compose).
      - type: rewrite
        source: /api/*
        destination: https://instalacam-backend.onrender.com/api/*
      # SPA fallback.
      - type: rewrite
        source: /*
        destination: /index.html

name: CI

on:
  pull_request:
  push:
    branches: [master, desarrollo]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m compileall app
      - name: Tests (pytest)
        run: python -m pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Tests (vitest)
        run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: services/whatsapp/package-lock.json }
      - run: npm ci --omit=dev
      - name: Comprobar sintaxis del gateway
        run: |
          node --check server.js
          node --check ledger.js
          node --check browser-locks.js
          node --check beta-compat.js
      - name: Probar persistencia y deduplicación
        run: npm test
      - run: npm audit --omit=dev --audit-level=high

  container:
    needs: [backend, frontend, whatsapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t instalacam-backend:ci ./backend
      - run: docker build -t instalacam-frontend:ci ./frontend
      - name: Verificar entrada pública y bloqueo de administración
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f instalacam-edge-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name instalacam-edge-ci -p 127.0.0.1:8095:8082 instalacam-frontend:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8095/ -o /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/verificar-acceso-publico.py --url http://127.0.0.1:8095 --solo-estatico
      - run: docker build -t instalacam-whatsapp:ci ./services/whatsapp

  release-validation:
    # Producción se ejecuta en el PC del propietario mediante Docker + Tailscale.
    # GitHub valida el merge; no dispone de acceso remoto al Docker local.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [container]
    runs-on: ubuntu-latest
    steps:
      - name: Registrar versión validada
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "Versión validada: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Destino: Docker + Tailscale en el PC del propietario." >> "$GITHUB_STEP_SUMMARY"
          echo "Este job no ejecuta el despliegue local ni acredita su estado." >> "$GITHUB_STEP_SUMMARY"

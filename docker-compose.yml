name: e-commerc-cam

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instalacam}
      POSTGRES_USER: ${POSTGRES_USER:-instalacam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  backend:
    image: e-commerc-cam-backend
    build: ./backend
    env_file:
      - path: .env
        required: true
      - path: .env.cloudflare
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instalacam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-instalacam}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - private_agreements:/app/private_agreements
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')\""]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: e-commerc-cam-frontend
    build: ./frontend
    ports:
      - "${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:8080"
    environment:
      VITE_API_PROXY: "${VITE_API_PROXY:-http://backend:8000}"
    depends_on:
      backend:
        condition: service_healthy
    networks: [default, cloudflare]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cloudflared:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [cloudflare]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://frontend:8080"]
    depends_on:
      frontend:
        condition: service_healthy
    networks: [cloudflare]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]

networks:
  cloudflare:

volumes:
  pgdata:
    name: ${PLATFORM_PG_VOLUME:-e-commerc-cam_plataforma_pgdata}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}
  uploads_data:
    name: ${PLATFORM_UPLOADS_VOLUME:-e-commerc-cam_plataforma_uploads}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}
  private_agreements:
    name: ${PLATFORM_AGREEMENTS_VOLUME:-e-commerc-cam_plataforma_agreements}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}

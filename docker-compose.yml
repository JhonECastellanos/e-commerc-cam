name: e-commerc-cam

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instalacam}
      POSTGRES_USER: ${POSTGRES_USER:-instalacam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10m
    stop_grace_period: 2m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  backend:
    image: e-commerc-cam-backend
    build: ./backend
    env_file:
      - path: .env
        required: true
      - path: .env.cloudflare
        required: false
      - path: .env.whatsapp
        required: false
      - path: .env.production-local
        required: false
      - path: .env.tailscale
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instalacam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-instalacam}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - private_agreements:/app/private_agreements
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')\""]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  whatsapp:
    image: e-commerc-cam-whatsapp
    build: ./services/whatsapp
    env_file:
      - path: .env.whatsapp
        required: false
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - whatsapp_session:/data
    shm_size: 256mb
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: e-commerc-cam-frontend
    build: ./frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:8080"
    environment:
      VITE_API_PROXY: "${VITE_API_PROXY:-http://backend:8000}"
    volumes:
      - ./frontend/nginx-public.conf:/etc/nginx/conf.d/public.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [default, cloudflare, internet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    profiles: [cloudflare]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://frontend:8082"]
    depends_on:
      frontend:
        condition: service_healthy
    networks: [cloudflare]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  tailscale:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    profiles: [internet]
    hostname: instalacam
    environment:
      TS_HOSTNAME: instalacam
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: "30m"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - type: bind
        source: ./.local/tailscale/config
        target: /config
        read_only: true
        bind: {create_host_path: false}
    networks: [internet]
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

networks:
  cloudflare:
  internet:

volumes:
  tailscale_state:
  whatsapp_session:
  pgdata:
    name: ${PLATFORM_PG_VOLUME:-e-commerc-cam_plataforma_pgdata}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}
  uploads_data:
    name: ${PLATFORM_UPLOADS_VOLUME:-e-commerc-cam_plataforma_uploads}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}
  private_agreements:
    name: ${PLATFORM_AGREEMENTS_VOLUME:-e-commerc-cam_plataforma_agreements}
    external: ${PLATFORM_VOLUMES_EXTERNAL:-false}

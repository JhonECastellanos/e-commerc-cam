services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instalacam}
      POSTGRES_USER: ${POSTGRES_USER:-instalacam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instalacam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-instalacam}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - private_agreements:/app/private_agreements
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')\""]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      VITE_API_PROXY: "${VITE_API_PROXY:-http://backend:8000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  uploads_data:
  private_agreements:
